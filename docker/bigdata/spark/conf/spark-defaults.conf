# SQL Extensions (Iceberg + Paimon)
spark.sql.extensions                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.apache.paimon.spark.extensions.PaimonSparkSessionExtensions

# Framework dependencies and user-provided extensions on every Spark node
spark.driver.extraClassPath              /opt/spark/extra-jars/*:/opt/spark/extensions/*
spark.executor.extraClassPath            /opt/spark/extra-jars/*:/opt/spark/extensions/*

# Iceberg Catalog (backed by Hive Metastore)
spark.sql.catalog.iceberg                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type            hive
spark.sql.catalog.iceberg.warehouse       hdfs://namenode:9000/user/hive/warehouse

# Paimon Catalog (backed by Hive Metastore，供 Doris paimon_fed 联邦查询)
spark.sql.catalog.paimon                  org.apache.paimon.spark.SparkCatalog
spark.sql.catalog.paimon.metastore        hive
spark.sql.catalog.paimon.warehouse        hdfs://namenode:9000/user/hive/warehouse/paimon

# Default catalog remains spark_catalog (Hive), switch via USE iceberg / paimon
