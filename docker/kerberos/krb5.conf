# Kerberos 实验室客户端配置，挂载到所有容器的 /etc/krb5.conf。
# 注意：Kerberos 对 hostname 非常敏感，这里显式关闭 DNS 反解和规范化，
# 保证 principal 名字与 compose 里的短 hostname 严格一致，避免最常见的坑。
[libdefaults]
    default_realm = LAB.LOCAL
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = false
    ticket_lifetime = 10h
    renew_lifetime = 7d
    forwardable = true

[realms]
    LAB.LOCAL = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    .lab.local = LAB.LOCAL
    lab.local = LAB.LOCAL
