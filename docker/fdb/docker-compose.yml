services:
  # 3 个节点，每节点 fdbmonitor 托管 2 个 fdbserver 进程（4500/4501）
  # FDB 客户端需要直连每个进程（coordinator/proxy/storage），macOS 宿主机
  # 无法路由到容器 IP，因此不做宿主机端口映射；客户端通过容器网络访问。
  fdb-node-1:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.3.63}
    container_name: fdb-node-1
    hostname: fdb-node-1
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "-g", "--", "/var/fdb/scripts/entrypoint.sh"]
    environment:
      NODE_NAME: fdb-node-1
      NODE_IP: 172.28.11.11
      FDB_COORDINATORS: 172.28.11.11:4500,172.28.11.12:4500,172.28.11.13:4500
      FDB_CLUSTER_ID: ${FDB_CLUSTER_ID:?Run ./bootstrap.sh to generate .env}
    volumes:
      - ./entrypoint.sh:/var/fdb/scripts/entrypoint.sh:ro
      - node1-data:/var/fdb/data
      - node1-logs:/var/fdb/logs
    networks:
      fdb:
        ipv4_address: 172.28.11.11
    healthcheck:
      test: ["CMD-SHELL", "fdbcli -C /var/fdb/fdb.cluster --exec 'status minimal' 2>/dev/null | grep -q 'The database is available'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2560m
          cpus: '2'
  fdb-node-2:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.3.63}
    container_name: fdb-node-2
    hostname: fdb-node-2
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "-g", "--", "/var/fdb/scripts/entrypoint.sh"]
    environment:
      NODE_NAME: fdb-node-2
      NODE_IP: 172.28.11.12
      FDB_COORDINATORS: 172.28.11.11:4500,172.28.11.12:4500,172.28.11.13:4500
      FDB_CLUSTER_ID: ${FDB_CLUSTER_ID:?Run ./bootstrap.sh to generate .env}
    volumes:
      - ./entrypoint.sh:/var/fdb/scripts/entrypoint.sh:ro
      - node2-data:/var/fdb/data
      - node2-logs:/var/fdb/logs
    networks:
      fdb:
        ipv4_address: 172.28.11.12
    healthcheck:
      test: ["CMD-SHELL", "fdbcli -C /var/fdb/fdb.cluster --exec 'status minimal' 2>/dev/null | grep -q 'The database is available'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2560m
          cpus: '2'
  fdb-node-3:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.3.63}
    container_name: fdb-node-3
    hostname: fdb-node-3
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "-g", "--", "/var/fdb/scripts/entrypoint.sh"]
    environment:
      NODE_NAME: fdb-node-3
      NODE_IP: 172.28.11.13
      FDB_COORDINATORS: 172.28.11.11:4500,172.28.11.12:4500,172.28.11.13:4500
      FDB_CLUSTER_ID: ${FDB_CLUSTER_ID:?Run ./bootstrap.sh to generate .env}
    volumes:
      - ./entrypoint.sh:/var/fdb/scripts/entrypoint.sh:ro
      - node3-data:/var/fdb/data
      - node3-logs:/var/fdb/logs
    networks:
      fdb:
        ipv4_address: 172.28.11.13
    healthcheck:
      test: ["CMD-SHELL", "fdbcli -C /var/fdb/fdb.cluster --exec 'status minimal' 2>/dev/null | grep -q 'The database is available'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2560m
          cpus: '2'
  # Prometheus exporter：aikoven/foundationdb-exporter，通过 FDB Node 客户端
  # 实时读取 \xff\xff/status/json（每次抓取实时采集），暴露 :9444/metrics。
  # 同时加入 monitor 模块的外部网络（monitor_monitor），供 Prometheus 抓取。
  # 仅发布 amd64 镜像，Apple Silicon 需 Rosetta 模拟。
  # 注意必须用 3.1.0：latest tag（2024-11）内置 FDB 7.1 客户端，连不上 7.3 集群
  # （IncompatibleProtocolVersion）；3.1.0（2025-10）内置 7.3.56 客户端。
  fdb-exporter:
    image: aikoven/foundationdb-exporter:3.1.0
    platform: linux/amd64
    container_name: fdb-exporter
    restart: unless-stopped
    environment:
      FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
      # FDB 客户端 trace 日志（排障用，目录必须预先存在）：docker exec fdb-exporter ls /tmp/trace
      FDB_NETWORK_OPTION_TRACE_ENABLE: /tmp/trace
    tmpfs:
      - /tmp/trace
    volumes:
      - ./fdb.cluster:/etc/foundationdb/fdb.cluster:ro
    depends_on:
      fdb-node-1:
        condition: service_healthy
    networks:
      - fdb
      - monitor
    healthcheck:
      # node 镜像无 wget/curl，用 node 自带 fetch；/metrics 会真实读一次集群状态
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9444/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  # 独立客户端容器（profile，默认不启动）：
  #   docker compose run --rm client            # 交互式 fdbcli
  #   docker compose run --rm client --exec "status"
  client:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.3.63}
    container_name: fdb-client
    profiles: ["client"]
    entrypoint: ["/usr/bin/fdbcli", "-C", "/var/fdb/fdb.cluster"]
    volumes:
      - ./fdb.cluster:/var/fdb/fdb.cluster:ro
    networks:
      fdb:
volumes:
  node1-data:
  node1-logs:
  node2-data:
  node2-logs:
  node3-data:
  node3-logs:
networks:
  fdb:
    ipam:
      config:
        - subnet: 172.28.11.0/24
  # monitor 模块的共享网络，由 ../monitor/bootstrap.sh 创建（fdb bootstrap 会自动拉起）
  monitor:
    name: monitor_monitor
    external: true
