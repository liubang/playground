<!DOCTYPE html>
<!-- Loom Web SPA (docs/WEB_DESIGN.md). Zero build chain: native ES modules
     served from embed.FS. Token gate and app shell share one document. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loom</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- Token gate (first visit / 401). Rendered standalone, no app chrome. -->
<div id="gate" class="gate-wrap" hidden>
  <form id="gate-form" class="gate">
    <div class="brand">◆ loom</div>
    <p>Enter the serve token to connect.</p>
    <input id="gate-token" type="password" autocomplete="off" placeholder="token" required>
    <div id="gate-error" class="gate-error" hidden></div>
    <button class="btn btn-primary" type="submit" style="width:100%">Connect</button>
    <div class="hint">
      Stored in sessionStorage only.<br>
      The token is printed on first <code>loom serve</code> start, or see
      <code>serve.token</code> in the loom data directory.
    </div>
  </form>
</div>

<!-- App shell -->
<div id="app" class="shell" hidden>
  <div class="app-body">
    <aside id="sidebar" class="sidebar">
      <div class="ws-bar">
        <span class="ws-bar-title">工作区</span>
        <button id="ws-add" class="icon-btn" title="添加工作区" data-icon="folder-plus"></button>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-foot">
        <button id="toggle-archived" class="foot-btn" title="查看归档会话">归档</button>
        <span class="sidebar-foot-brand">◆ loom</span>
      </div>
    </aside>
    <main class="main">
      <header class="app-header">
        <button id="hdr-sidebar" class="icon-btn" title="折叠/展开侧栏" data-icon="bars"></button>
        <button id="hdr-theme" class="icon-btn" title="切换主题" data-icon="circle-half-stroke"></button>
        <button id="hdr-settings" class="icon-btn" title="设置" data-icon="gear"></button>
        <button id="hdr-session" class="sess mono" title="copy session id" hidden></button>
        <button id="hdr-share" class="icon-btn" title="分享会话：复制公开只读链接（Shift+点击撤销分享）" data-icon="share" hidden></button>
        <span id="hdr-readonly" class="badge is-awaiting" hidden><span class="dot"></span><span class="txt">sub-agent · read-only</span></span>
        <span id="hdr-state" class="badge"><span class="dot"></span><span class="txt"></span></span>
        <span class="spacer"></span>
        <span id="hdr-conn" class="badge"><span class="dot"></span><span class="txt"></span></span>
      </header>

      <div id="transcript" class="transcript">
        <div id="blocks" class="transcript-inner"></div>
        <div id="empty-state" class="empty-state" hidden>
          <div class="brand">◆ loom</div>
          <p id="empty-hint">No session selected. Start a new one, or pick one from the list.</p>
          <p><button id="empty-add-ws" class="btn" type="button" hidden>Add workspace&hellip;</button></p>
        </div>
        <button id="follow-btn" class="follow-btn" hidden><span data-icon="arrow-down"></span> back to bottom</button>
      </div>

      <div class="composer">
        <details id="plan-panel" class="plan-panel disclosure" open hidden></details>
        <div class="composer-box">
          <textarea id="composer-input" rows="1" placeholder="Message loom…"></textarea>
          <div class="composer-bar">
            <div class="composer-tools">
              <button id="model-btn" class="picker-btn" title="切换模型">
                <span class="picker-label">model</span><span class="picker-caret" data-icon="caret-down"></span>
              </button>
              <button id="reasoning-btn" class="picker-btn" title="设置 reasoning">
                <span class="picker-label">reasoning</span><span class="picker-caret" data-icon="caret-down"></span>
              </button>
            </div>
            <div class="composer-actions">
              <span id="ctx-gauge" class="ctx-gauge" hidden>
                <svg class="ctx-ring" viewBox="0 0 18 18" aria-hidden="true">
                  <circle class="ctx-ring-bg" cx="9" cy="9" r="7"></circle>
                  <circle class="ctx-ring-fg" cx="9" cy="9" r="7"></circle>
                </svg>
                <span class="ctx-gauge-pct"></span>
              </span>
              <button id="cancel-btn" class="icon-btn-circle btn-danger" title="cancel turn" data-icon="stop" hidden></button>
              <button id="send-btn" class="send-btn" title="发送 (Enter)" data-icon="arrow-up"></button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="banner" class="banner" hidden></div>
  <footer class="statusbar">
    <span id="sb-usage" class="mono"></span>
    <span id="sb-turn"></span>
    <span class="spacer"></span>
    <span id="sb-version"></span>
  </footer>
</div>

<!-- 下拉菜单浮层（模型 / reasoning 共用） -->
<div id="menu" class="menu" hidden></div>

<!-- 设置面板：左侧 tab 导航 + 右侧表单区；保存即热更新（分级生效） -->
<div id="settings-wrap" class="settings-wrap" hidden>
  <div class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="settings-head">
      <span class="settings-title" id="settings-title">设置</span>
      <span id="settings-path" class="settings-path mono" title="配置文件路径"></span>
      <span class="spacer"></span>
      <button id="settings-close" class="icon-btn" title="关闭 (Esc)" data-icon="xmark"></button>
    </header>
    <div class="settings-body">
      <nav id="settings-tabs" class="settings-tabs" aria-label="设置分类"></nav>
      <div id="settings-content" class="settings-content"></div>
    </div>
    <footer class="settings-foot">
      <span id="settings-msg" class="settings-msg"></span>
      <span class="spacer"></span>
      <button id="settings-reload" class="btn btn-secondary" type="button">重新加载</button>
      <button id="settings-save" class="btn btn-primary" type="button">保存</button>
    </footer>
  </div>
</div>

<!-- 确认弹窗（删除会话等破坏性操作） -->
<div id="confirm-modal" class="modal-wrap" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-title" id="confirm-title"></div>
    <div class="modal-body" id="confirm-body"></div>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn btn-secondary" type="button">取消</button>
      <button id="confirm-ok" class="btn btn-danger" type="button">删除</button>
    </div>
  </div>
</div>

<!-- 目录浏览弹窗（添加工作区选择目录） -->
<div id="dir-modal" class="modal-wrap" hidden>
  <div class="modal dir-modal" role="dialog" aria-modal="true" aria-labelledby="dir-title">
    <div class="modal-title" id="dir-title">选择工作区目录</div>
    <div class="dir-current">
      <button id="dir-up" class="icon-btn" title="上一级" type="button" data-icon="turn-up"></button>
      <nav id="dir-path" class="dir-crumbs" aria-label="当前目录"></nav>
    </div>
    <div id="dir-list" class="dir-list"></div>
    <div class="modal-actions">
      <button id="dir-cancel" class="btn btn-secondary" type="button">取消</button>
      <button id="dir-select" class="btn btn-primary" type="button">选择此目录</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
