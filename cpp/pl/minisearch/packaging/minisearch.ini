# MiniSearch 服务配置（由 control 脚本 source，格式为 key=value，等号两侧无空格）
# 修改后 ./control restart 生效。

# ---- minisearch 检索服务 ----
MINISEARCH_PORT=8200
# 监听地址；非回环地址强制要求 AUTH=true（fail-closed）
LISTEN=127.0.0.1
# true = 全端点 Bearer 认证（/healthz 除外），首次启动自动生成 bootstrap admin key
AUTH=false
# 数据目录（相对包根目录或绝对路径）：checkpoint、auth keys
DATA_DIR=data
# FAISS 索引类型：Flat / IVF256,Flat / HNSW32 ...
INDEX_TYPE=Flat

# ---- 本地推理服务（embedding + rerank 同进程）----
EMBEDDING_PORT=18000
EMBEDDING_HOST=127.0.0.1
EMBEDDING_MODEL=BAAI/bge-m3
# 置空则关闭 /v1/rerank（检索请求的 rerank=true 会降级为 RRF 序）
RERANK_MODEL=BAAI/bge-reranker-v2-m3
EMBEDDING_MAX_LENGTH=512
