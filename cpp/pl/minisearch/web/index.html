<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniSearch Console</title>
    <link rel="stylesheet" href="/console/css/app.css" />
  </head>
  <body>
    <!-- Login Page -->
    <div id="login-page" class="page hidden">
      <div class="login-card">
        <h1 class="logo">🔍 MiniSearch</h1>
        <p class="subtitle">混合检索服务控制台</p>
        <form id="login-form">
          <div class="form-group">
            <label for="login-user">用户名</label>
            <input type="text" id="login-user" name="user" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-password">密码</label>
            <input
              type="password"
              id="login-password"
              name="password"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="login-btn">登录</button>
          <p class="error-text hidden" id="login-error"></p>
        </form>
      </div>
    </div>

    <!-- Main Layout -->
    <div id="app" class="app-layout hidden">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <span class="logo-sm">🔍 MiniSearch</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#/search" class="nav-item" data-route="search">🔍 搜索</a>
          <a href="#/collections" class="nav-item" data-route="collections">📁 Collections</a>
          <a href="#/documents" class="nav-item" data-route="documents">📄 文档</a>
          <a href="#/tenants" class="nav-item" data-route="tenants">🏢 租户管理</a>
          <a href="#/keys" class="nav-item" data-route="keys">🔑 密钥管理</a>
          <a href="#/stats" class="nav-item" data-route="stats">📊 统计</a>
        </nav>
        <div class="sidebar-footer">
          <div class="user-info">
            <span id="user-tenant" class="badge"></span>
            <span id="user-role" class="badge"></span>
          </div>
          <button class="btn btn-text" id="logout-btn">退出</button>
        </div>
      </aside>

      <!-- Content -->
      <main class="content">
        <!-- Search Page -->
        <section id="route-search" class="route-page hidden">
          <h2>搜索</h2>
          <div class="toolbar">
            <select id="search-collection" class="select"></select>
            <input
              type="text"
              id="search-text"
              class="input"
              placeholder="输入查询文本..."
              style="flex: 1"
            />
            <label class="checkbox"><input type="checkbox" id="search-rerank" /> Rerank</label>
            <label class="inline-label"
              >Top K:
              <input
                type="number"
                id="search-topk"
                value="10"
                min="1"
                max="100"
                style="width: 60px"
            /></label>
            <button class="btn btn-primary" id="search-btn">搜索</button>
          </div>
          <div class="weight-controls">
            <label class="inline-label"
              >BM25 权重:
              <input
                type="number"
                id="search-bm25-weight"
                value="1.0"
                step="0.1"
                min="0"
                style="width: 70px"
            /></label>
            <label class="inline-label"
              >向量权重:
              <input
                type="number"
                id="search-vec-weight"
                value="1.0"
                step="0.1"
                min="0"
                style="width: 70px"
            /></label>
          </div>
          <div id="search-results" class="results-container"></div>
        </section>

        <!-- Collections Page -->
        <section id="route-collections" class="route-page hidden">
          <div class="page-header">
            <h2>Collections</h2>
            <button class="btn btn-primary" id="create-collection-btn">+ 新建</button>
          </div>
          <div id="collections-list" class="card-list"></div>
          <!-- Create Collection Modal -->
          <div id="create-collection-modal" class="modal hidden">
            <div class="modal-content">
              <h3>新建 Collection</h3>
              <form id="create-collection-form">
                <div class="form-group">
                  <label>名称</label>
                  <input type="text" id="cc-name" required placeholder="loom-kb" />
                </div>
                <div class="form-group">
                  <label>Schema (JSON)</label>
                  <textarea
                    id="cc-schema"
                    rows="12"
                    class="code-input"
                    placeholder='{"fields":[{"name":"title","type":"text","indexed":true,"stored":true},{"name":"content","type":"text","indexed":true,"stored":true,"analyzer":"cjk_jieba"},{"name":"content_vec","type":"vector","dims":1024,"metric":"cosine","source_field":"content","mode":"server"}]}'
                  ></textarea>
                </div>
                <div class="form-group">
                  <label>默认 Analyzer</label>
                  <input type="text" id="cc-analyzer" value="cjk_jieba" placeholder="cjk_jieba" />
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn" id="cc-cancel">取消</button>
                  <button type="submit" class="btn btn-primary">创建</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Documents Page -->
        <section id="route-documents" class="route-page hidden">
          <div class="page-header">
            <h2>文档管理</h2>
            <div class="toolbar">
              <select id="docs-collection" class="select"></select>
              <button class="btn" id="docs-refresh">刷新</button>
              <button class="btn btn-primary" id="docs-import">导入 Markdown</button>
            </div>
          </div>
          <div id="documents-list" class="table-container"></div>
          <div id="docs-pagination" class="pagination"></div>
          <!-- Import Modal -->
          <div id="import-modal" class="modal hidden">
            <div class="modal-content modal-wide">
              <h3>导入 Markdown</h3>
              <form id="import-form">
                <div class="form-group">
                  <label>文档名称</label>
                  <input type="text" id="import-name" required placeholder="my-doc" />
                </div>
                <div class="form-group">
                  <label>Markdown 内容</label>
                  <textarea
                    id="import-content"
                    rows="14"
                    class="code-input"
                    placeholder="# Title&#10;Content..."
                  ></textarea>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>切分策略</label>
                    <select id="import-strategy">
                      <option value="markdown">Markdown（标题感知）</option>
                      <option value="fixed">定长</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Chunk Size</label>
                    <input type="number" id="import-chunk-size" value="1000" min="100" />
                  </div>
                  <div class="form-group">
                    <label>Chunk Overlap</label>
                    <input type="number" id="import-chunk-overlap" value="100" min="0" />
                  </div>
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn" id="import-cancel">取消</button>
                  <button type="submit" class="btn btn-primary">导入</button>
                </div>
              </form>
            </div>
          </div>
          <!-- Document Detail Modal -->
          <div id="doc-detail-modal" class="modal hidden">
            <div class="modal-content modal-wide">
              <h3>文档详情</h3>
              <div id="doc-detail-content"></div>
              <div class="modal-actions">
                <button type="button" class="btn" id="doc-detail-close">关闭</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Tenants Page -->
        <section id="route-tenants" class="route-page hidden">
          <div class="page-header">
            <h2>租户管理</h2>
            <button class="btn btn-primary" id="create-tenant-btn">+ 新建</button>
          </div>
          <div id="tenants-list" class="card-list"></div>
          <div id="create-tenant-modal" class="modal hidden">
            <div class="modal-content">
              <h3>新建租户</h3>
              <form id="create-tenant-form">
                <div class="form-group">
                  <label>租户名称</label>
                  <input type="text" id="ct-name" required placeholder="my-team" />
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn" id="ct-cancel">取消</button>
                  <button type="submit" class="btn btn-primary">创建</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Keys Page -->
        <section id="route-keys" class="route-page hidden">
          <div class="page-header">
            <h2>密钥管理</h2>
            <div class="toolbar">
              <select id="keys-tenant" class="select"></select>
              <button class="btn btn-primary" id="issue-key-btn">+ 签发</button>
            </div>
          </div>
          <div id="keys-list" class="table-container"></div>
          <div id="issue-key-modal" class="modal hidden">
            <div class="modal-content">
              <h3>签发 API Key</h3>
              <form id="issue-key-form">
                <div class="form-group">
                  <label>角色</label>
                  <select id="ik-role">
                    <option value="tenant_admin">tenant_admin</option>
                    <option value="writer">writer</option>
                    <option value="reader">reader</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Collection 白名单（逗号分隔，空 = 全部）</label>
                  <input type="text" id="ik-collections" placeholder="loom-kb,code-search" />
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn" id="ik-cancel">取消</button>
                  <button type="submit" class="btn btn-primary">签发</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Stats Page -->
        <section id="route-stats" class="route-page hidden">
          <h2>统计</h2>
          <div id="stats-content" class="stats-container"></div>
        </section>
      </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="/console/js/api.js"></script>
    <script src="/console/js/app.js"></script>
  </body>
</html>
