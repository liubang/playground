syntax = "proto3";

package pl.minisearch.proto;

option cc_generic_services = true;

// 字段定义，type: "text" | "keyword" | "numeric" | "vector"
message FieldDef {
  string name = 1;
  string type = 2;
  bool indexed = 3;
  bool stored = 4;
  string analyzer = 5;
  int32 dims = 6;
  string metric = 7;
  // vector only: source text field for server-side embedding
  string source_field = 8;
  // vector only: "server" | "client"
  string mode = 9;
}

message CollectionSpec {
  string name = 1;
  repeated FieldDef fields = 2;
  string default_analyzer = 3;
}

message GenericResponse {
  bool ok = 1;
  string error = 2;
}

message CollectionEntryMsg {
  string name = 1;
  int64 active_documents = 2;
}

message ListCollectionsResponse {
  repeated CollectionEntryMsg collections = 1;
}

// 动态类型字段值
message FieldValue {
  oneof kind {
    string s = 1;
    double n = 2;
    FloatVector v = 3;
  }
}

message FloatVector {
  repeated float data = 1;
}

message Document {
  string id = 1;
  int64 version = 2;
  map<string, FieldValue> fields = 3;
  // Checkpoint 内部字段：文档的内部 docid。API 请求忽略（服务端分配）。
  int64 internal_docid = 4;
}

message UpsertResponse {
  bool ok = 1;
  string error = 2;
  int64 internal_docid = 3;
  int64 superseded_docid = 4;
}

message GetDocumentResponse {
  bool found = 1;
  Document document = 2;
}

message Hit {
  string id = 1;
  double score = 2;
  Document document = 3;
}

// RRF 融合权重（DESIGN.md §7.1）。权重为 0 显式关闭对应检索路。
message SearchWeights {
  double bm25 = 1;
  double vector = 2;
}

// 单个过滤子句。op: "=" | "!=" | ">" | ">=" | "<" | "<=" | "in"。
// = / != / 范围操作取 values[0]；in 取全部 values。
message FilterClause {
  string field = 1;
  string op = 2;
  repeated FieldValue values = 3;
}

// 过滤表达式（DESIGN.md §7.3）：所有子句取 AND，M1 后置应用。
message Filter {
  repeated FilterClause and = 1;
}

message SearchRequest {
  string collection = 1;
  // 原始查询文本，服务端调用 embedding（需要配置 embedding client）
  string text = 2;
  // 预计算 query 向量（与 text 二选一，同时提供时 embedding 优先）
  repeated float embedding = 3;
  int32 top_k = 4;
  // 缺省 = collection 默认（1.0/1.0）
  SearchWeights weights = 5;
  Filter filter = 6;
  // 请求 cross-encoder 重排（需要配置 rerank client，否则降级并标记）
  bool rerank = 7;
}

message SearchResponse {
  repeated Hit hits = 1;
  string error = 2;
  // 降级标记（DESIGN.md §7.5）："vector" | "rerank"
  repeated string degraded = 3;
  int64 took_ms = 4;
}

// queries:analyze 调试端点（DESIGN.md §6.2）
message AnalyzeRequest {
  string text = 1;
}

message AnalyzedToken {
  string term = 1;
  uint32 pos = 2;
  uint32 begin = 3;
  uint32 end = 4;
}

message AnalyzeResponse {
  repeated AnalyzedToken tokens = 1;
}

message AdminTenantStats {
  string name = 1;
  int64 collections = 2;
  int64 active_documents = 3;
}

message AdminStatsResponse {
  repeated AdminTenantStats tenants = 1;
  int64 total_collections = 2;
  int64 total_active_documents = 3;
}

message HttpRequest {}
message HttpResponse {}

// checkpoint manifest（storage 层内部格式，见 storage/checkpoint.h）
message CheckpointManifest {
  int64 seq = 1;
  CollectionSpec spec = 2;
  string index_type = 3;
  repeated string files = 4;
}

// 租户与 API key 管理（DESIGN.md §10.5）
message AdminTenantEntry {
  string name = 1;
  int64 collections = 2;
}

message AdminListTenantsResponse {
  repeated AdminTenantEntry tenants = 1;
}

message AdminIssueKeyRequest {
  string role = 1;  // tenant_admin | writer | reader（admin 仅 bootstrap）
  repeated string collections = 2;  // 白名单，空 = 本租户全部
}

message AdminIssueKeyResponse {
  string key_id = 1;
  string key = 2;  // 明文仅此一次返回
}

message AdminKeyEntry {
  string key_id = 1;
  string tenant = 2;
  string role = 3;
  repeated string collections = 4;
  int64 created_at = 5;
  bool revoked = 6;
}

message AdminListKeysResponse {
  repeated AdminKeyEntry keys = 1;
}

// 显式创建租户（console 管理面）
message AdminCreateTenantRequest {
  string name = 1;  // [A-Za-z0-9_-]{1,64}
}

// 文档分页列表（console 文档管理）。向量字段不出现在列表响应中。
message ListDocumentsResponse {
  repeated Document documents = 1;
  int64 total = 2;  // 活跃文档总数（不受分页影响）
}

// markdown 批量导入：服务端切分 + 逐 chunk upsert（含 server-side embedding）。
// chunk 文档 id 为 "<name>#chunk_<i>"；重导同名文档先按该前缀删除旧 chunk，
// 保证幂等。
message ImportDocumentsRequest {
  string name = 1;      // 源文档名（chunk id 前缀，不得包含 '#'）
  string content = 2;   // markdown 全文
  string strategy = 3;  // "markdown"（默认，标题感知）| "fixed"（定长+overlap）
  int32 chunk_size = 4;     // 目标 chunk 字节数，<=0 取默认 1000
  int32 chunk_overlap = 5;  // 二级切分重叠字节数，<0 取默认 100
  string text_field = 6;    // 正文写入的 text 字段；空 = 自动探测（body/content/首个 text 字段）
  string title_field = 7;   // 标题路径写入字段；空 = 自动探测（schema 含 "title" 则写入）
  map<string, FieldValue> fields = 8;  // 合并进每个 chunk 的静态字段
}

message ImportDocumentsResponse {
  bool ok = 1;
  string error = 2;
  int64 chunks = 3;
  repeated string document_ids = 4;
}

// console 账号密码登录（session token，内存态，TTL 有限）
message LoginRequest {
  string user = 1;
  string password = 2;
}

message LoginResponse {
  bool ok = 1;
  string error = 2;
  string token = 3;       // Bearer token（"mss_" 前缀）
  string role = 4;
  string tenant = 5;
  int64 expires_in = 6;   // seconds
}

message WhoAmIResponse {
  string tenant = 1;
  string role = 2;
  string key_id = 3;
  string auth_type = 4;  // "session" | "api_key" | "anonymous"
}

// 修改 console 账号密码（凭旧密码自助，无需已有 session）
message ChangePasswordRequest {
  string user = 1;
  string old_password = 2;
  string new_password = 3;
}

service MiniSearchHttpService {
  rpc default_method(HttpRequest) returns (HttpResponse);
}
