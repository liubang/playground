name: squash-coverage
# 定期压缩 coverage 分支历史：该分支由多个 CI workflow 用
# peaceiris/actions-gh-pages 逐次追加 commit（每次部署一个），历史会无限增长。
# 本 job 把整个分支压成单个 orphan commit（文件内容不变），force push 回去。
on:
  schedule:
    # 每天 UTC 04:17 执行（避开各语言 coverage job 的常见触发窗口）
    - cron: "17 4 * * *"
  workflow_dispatch:
concurrency:
  group: squash-coverage
  cancel-in-progress: false
jobs:
  squash:
    name: squash coverage branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: coverage
          fetch-depth: 0
      - name: squash history into single commit
        run: |
          set -euo pipefail
          # 并发防护：4 个 coverage deploy job（main push 触发，无固定时间）与本次
          # cron 可能同时写 coverage 分支。用 --force-with-lease 检测并发——远程头
          # 变化则放弃本次、重新基于最新远程重建再试，避免覆盖刚部署的报告。
          # 孤儿 commit 保证历史恒定 1 条。
          for i in 1 2 3; do
            git fetch -q origin coverage
            git branch -D squash-tmp >/dev/null 2>&1 || true
            git checkout -q --orphan squash-tmp
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            git checkout -q origin/coverage -- .
            git add -A
            git -c user.name="liubang" -c user.email="it.liubang@gmail.com" \
              commit -q -m "coverage: squash history"
            if git push --force-with-lease origin squash-tmp:coverage; then
              echo "squashed coverage to $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "::warning::push rejected (attempt $i): coverage deploy may be racing; retrying in 15s"
            sleep 15
          done
          echo "::error::failed to squash coverage branch after 3 attempts"
          exit 1
