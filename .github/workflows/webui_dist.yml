name: webui-dist
on:
  push:
    branches:
      - main
    paths:
      - "go/pl/loom/internal/server/webui/**"
      - "go/pl/loom/internal/server/web/dist/**"
      - ".github/workflows/webui_dist.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dist-sync:
    # 兜底「改了 webui 源码但忘记刷新 dist 就提交」：dist 是提交入库的构建
    # 产物（embed.FS 内嵌），必须与源码保持一致，不一致即红。
    name: webui dist in sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # pnpm 版本由 package.json 的 packageManager 字段锚定（corepack 自动供应）
      - name: enable corepack
        run: corepack enable
      - name: build webui
        run: |
          cd go/pl/loom/internal/server/webui
          pnpm install --frozen-lockfile
          pnpm build
      - name: dist must match committed output
        run: git diff --exit-code go/pl/loom/internal/server/web/dist
